name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/phpunit --testsuite unit
      - name: Smoke test over real HTTP
        run: |
          php -S 127.0.0.1:8099 tests/smoke/server.php > /dev/null 2>&1 &
          sleep 1
          php tests/smoke/smoke.php http://127.0.0.1:8099
      - name: Static analysis
        if: matrix.php == '8.4'
        run: vendor/bin/phpstan analyse --no-progress
      - name: The generated types match the specs
        if: matrix.php == '8.4'
        run: |
          composer generate
          git diff --exit-code -- src/Shipping/Types.php
