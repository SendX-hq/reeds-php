name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}, Guzzle ${{ matrix.guzzle }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4", "8.5"]
        guzzle: ["7", "8"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - name: Install, with the matrix's Guzzle
        run: composer update --no-interaction --no-progress --prefer-dist --with "guzzlehttp/guzzle:^${{ matrix.guzzle }}.0"
      - run: vendor/bin/phpunit --testsuite unit
      - name: Smoke test over real HTTP
        run: |
          php -S 127.0.0.1:8099 tests/smoke/server.php > /dev/null 2>&1 &
          sleep 1
          php tests/smoke/smoke.php http://127.0.0.1:8099
      - name: Static analysis
        if: matrix.php == '8.5'
        run: vendor/bin/phpstan analyse --no-progress
      - name: The generated types match the specs
        if: matrix.php == '8.5' && matrix.guzzle == '8'
        run: |
          composer generate
          git diff --exit-code -- src/Shipping/Types.php
